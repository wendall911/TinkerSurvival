plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    // https://plugins.gradle.org/plugin/me.modmuss50.mod-publish-plugin
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
    // https://plugins.gradle.org/plugin/se.bjurr.gitchangelog.git-changelog-gradle-plugin
    id 'se.bjurr.gitchangelog.git-changelog-gradle-plugin' version '3.0.7'
    id 'io.freefair.lombok' version '8.14.2'
}

repositories {
    maven {
        // location of the maven that hosts Mantle and JEI files
        name = 'Old JEI, Tinkers and Mantle'
        url 'https://dvs1.progwml6.com/files/maven/'
    }

    maven {
        name = 'Curse Maven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }

    maven {
        // Patchouli && Provider
        name = 'BlameJared Maven (CrT / Bookshelf / JEI (Newer) / vazkii / xyz)'
        url = 'https://maven.blamejared.com'
    }

    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }

    maven {
        name = 'wendall911 maven'
        url = 'https://raw.githubusercontent.com/wendall911/maven/main/'
    }
}

group = 'com.github.wendall911.tinkersurvival'
def actualVersion = version
version = "${minecraft_version}-${version}"
archivesBaseName = "${mod_name}"

sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '17'

minecraft {
    mappings channel: 'parchment', version: "${mappings_version}-${minecraft_version}"

    runs {
        client {
            workingDirectory project.file("run").canonicalPath
            property 'forge.logging.console.level', 'debug'

            mods {
                tinkersurvival {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'

            mods {
                tinkersurvival {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'tinkersurvival',
                    '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/'),
                    '--existing', file('src/generated/resources')

            mods {
                tinkersurvival {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

    implementation fg.deobf("slimeknights.mantle:Mantle:${minecraft_version}-${mantle_version}")
    implementation fg.deobf("slimeknights.tconstruct:TConstruct:${minecraft_version}-${tic_version}")
    implementation fg.deobf(group: 'com.github.wendall911.survivalistessentials', name: 'SurvivalistEssentials', version: "${minecraft_version}-${se_version}")
    implementation fg.deobf("curse.maven:homeostatic-634466:${homeostatic_version}")
    implementation fg.deobf("vazkii.patchouli:Patchouli:${minecraft_version}-${patchouli_version}-FORGE")
    compileOnly fg.deobf("xyz.brassgoggledcoders:PatchouliProvider:${minecraft_version}-${patchouli_provider_version}")
    implementation fg.deobf("curse.maven:chargedcharms-682683:${chargedcharms_version}")

    if (System.getenv('DATA_GEN') == null) {
        runtimeOnly fg.deobf(group: 'technology.roughness.whitenoise', name: "whitenoise-${minecraft_version}-forge", version: "${whitenoise_version}")
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
        runtimeOnly fg.deobf("curse.maven:top-245211:${probe_version}")
        runtimeOnly fg.deobf("curse.maven:botania-225643:${botania_version}")
        runtimeOnly fg.deobf("curse.maven:immersiveengineering-231951:${ie_version}")
        runtimeOnly fg.deobf("curse.maven:sol_carrot-277616:${sol_carrot_version}")
        runtimeOnly fg.deobf("curse.maven:titanium-287342:${titanium_version}")
        runtimeOnly fg.deobf("curse.maven:sushigocrafting-452500:${sushigocrafting_version}")
        runtimeOnly fg.deobf("curse.maven:culinary_construct-296676:${culinary_construct_version}")
        //runtimeOnly fg.deobf("curse.maven:architectury-419699:${architectury_version}")
        // Crashes in development environment
        //runtimeOnly fg.deobf("curse.maven:bmo-567709:${bmo_version}")
    }
    else {
        runtimeOnly fg.deobf("curse.maven:create-328085:${create_version}")
        runtimeOnly fg.deobf("xyz.brassgoggledcoders:PatchouliProvider:${minecraft_version}-${patchouli_provider_version}")
    }

    runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}+${minecraft_version}")
    runtimeOnly fg.deobf("curse.maven:comforts-276951:${comforts_version}")

    implementation fg.deobf(fileTree(dir: 'libs', include: '*.jar'))
}

def commonManifest = {
    attributes 'FMLAT': 'tinkersurvival_at.cfg'
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_name,
            "Specification-Vendor": "${mod_author}",
            "Specification-Version": "${archiveVersion}",
            "Implementation-Title": "${mod_name}",
            "Implementation-Version": "${archiveVersion}",
            "Implementation-Vendor" :"${mod_author}",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
    'version': actualVersion,
    'minecraft_version': minecraft_version,
    'forge_mc_version_range': forge_mc_version_range,
    'forge_version_range': forge_version_range,
    'se_version': se_version,
    'se_version_range': se_version_range,
    'tic_version_range': tic_version_range,
    'license': license,
    'mod_id': mod_id,
    'mod_author': mod_author,
    'mod_description': mod_description,
    'mod_display_name': mod_display_name,
    'mod_name': mod_name,
    'mod_credits': mod_credits,
    'mod_update_branch': mod_update_branch,
    'pack_format': pack_format,
    'curseforge_slug': curseforge_slug
]

processResources {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    inputs.properties replaceProperties
    replaceProperties.put 'project', project
    exclude '.cache'

    filesMatching(resourceTargets) {
        expand replaceProperties
    }
}

jar.finalizedBy('reobfJar')

task changelog(type: se.bjurr.gitchangelog.plugin.gradle.GitChangelogTask) {
    file.set(new File(project(":").projectDir.toString() + '/build/libs/changelog.txt'));
    templateContent.set(file(project(":").projectDir.toString() + '/files/templates/changelog.mustache').getText('UTF-8'));
    toRevision.set('HEAD');
    fromRevision.set("${minecraft_version}-${last_mod_version}");
}

def updates = tasks.register("generateUpdates", Copy) {
    it.outputs.upToDateWhen {
        false
    }

    it.from("./files/templates/") {
        include 'updates.json'
        expand replaceProperties
    }

    it.into 'files/'
}

tasks.build.dependsOn('changelog', 'generateUpdates')

def changelogFile = project(":").projectDir.toString() + '/build/libs/changelog.txt'
def publishFile = project(":").projectDir.toString() + "/build/libs/${archivesBaseName}-${version}.jar"

publishMods {
    file = file(publishFile)
    if (file(changelogFile).exists()) {
        changelog = file(changelogFile).text
    }
    type = "${release_type}".startsWith("release") ? STABLE : ("${release_type}".startsWith("beta") ? BETA : ALPHA)
    modLoaders.addAll(['neoforge', 'forge'])
    dryRun = providers.environmentVariable('DO_RELEASE').getOrNull() == null

    if (project.hasProperty("${curseforge_api_key_prop}")) {
        curseforge {
            accessToken = project.property("${curseforge_api_key_prop}")
            projectId = "${curseforge_id}"
            projectSlug = "${curseforge_slug}"
            javaVersions.add(JavaVersion.toVersion("${java_version}"))
            clientRequired = true
            serverRequired = true
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('survivalist-essentials')
            requires('mantle')
            requires('tinkers-construct')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks')
            optional('homeostatic')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('tcintegrations')
            optional('ready-player-fun')
            optional('configured')
            optional('catalogue')
            optional('fruit-trees')
            optional('quark')
            optional('biomes-o-plenty')
            optional('all-you-can-eat')
            optional('water-source')
            optional('sushigocrafting')
            optional('botania')
            optional('ars-nouveau')
            optional('exnihilosequentia')
            optional('the-undergarden')
            optional('dynamictrees')
            optional('oh-the-biomes-weve-gone')
            optional('the-twilight-forest')
            optional('ecologics')
            optional('alexs-mobs')
            optional('betteranimalsplus')
            optional('malum')
            optional('ice-and-fire-dragons')
            optional('psi')
            optional('regions-unexplored')
            optional('create')
        }
    }
    if (project.hasProperty("${modrinth_api_key_prop}")) {
        modrinth {
            accessToken = project.property("${modrinth_api_key_prop}")
            projectId = "${modrinth_id}"
            minecraftVersions.addAll("${release_versions}".split(','))
            requires('survivalist-essentials')
            requires('mantle')
            requires('tinkers-construct')
            optional('actually-harvest')
            optional('betterdays')
            optional('charged-charms')
            optional('creeper-fireworks-mod')
            optional('homeostatic')
            optional('magical-psi-revival')
            optional('simpletextoverlay')
            optional('tcintegrations')
            optional('ready-player-fun')
            optional('quark')
            optional('allyoucaneat')
            optional('botania')
            optional('exnihilosequentia')
            optional('dynamictrees')
            optional('oh-the-biomes-weve-gone')
            optional('ecologics')
            optional('psi')
            optional('regions-unexplored')
            optional('create')
        }
    }
    if (project.hasProperty("${discord_webhook_prop}")) {
        discord {
            webhookUrl = project.property("${discord_webhook_prop}")
            dryRunWebhookUrl = project.property("${discord_dryrun_webhook_prop}")
            username = "${mod_author}"
            content = changelog.map {
                "# A new version of ${mod_display_name} for Forge ${minecraft_version} has been released! \n" + it
            }
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            // This gives us the built obfuscated version Forge requires
            artifact jar
        }
    }
    repositories {
        if (System.getenv('local_maven') != null) {
            maven {
                url 'file://' + System.getenv('local_maven')
            }
        }
    }
}
